<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mombirthday.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .hero{
    position: relative;
    min-height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(180deg, var(--blue-soft) 0%, var(--cream) 55%);
    overflow: hidden;
    padding: 6% 8%;
  }

  .hero .blob.b1{
    width: 40%; aspect-ratio: 1/1;
    background: var(--pink-soft);
    top: -10%; left: -12%;
  }
  .hero .blob.b2{
    width: 45%; aspect-ratio: 1/1;
    background: var(--yellow-soft);
    bottom: -14%; right: -14%;
  }
  .hero .blob.b3{
    width: 20%; aspect-ratio: 1/1;
    background: var(--blue-soft);
    top: 12%; right: 6%;
    opacity: 0.8;
  }

  .hero-content{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6%;
  }

  .eyebrow{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    border: 1px solid var(--blue-soft);
    color: var(--blue-mid);
    font-size: clamp(0.75rem, 3vw, 0.9rem);
    font-weight: 600;
    padding: 2% 6%;
    border-radius: 999px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .hero h1{
    font-size: clamp(2.2rem, 10vw, 4rem);
    line-height: 1.08;
  }

  .hero h1 .accent{
    color: var(--pink);
  }

  .hero p.tag{
    color: var(--ink-soft);
    font-size: clamp(0.95rem, 3.6vw, 1.15rem);
    max-width: 32ch;
  }

  .candle-row{
    display: flex;
    gap: 3%;
    margin-top: 2%;
  }

  .candle-row span{
    font-size: clamp(1.2rem, 5vw, 1.8rem);
  }
</style>
</head>
<body>

<main class="hero">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="hero-content">
    <span class="eyebrow">A little something for you</span>
    <h1>Happy Birthday,<br><span class="accent">Mom!</span></h1>
    <a class="btn" href="home.html">Explore mombirthday.com</a>
  </div>
</main>

<footer class="site-footer">
  By Avi Jain
</footer>

</body>
</html>
